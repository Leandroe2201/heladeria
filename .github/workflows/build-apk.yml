name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Crear google-services.json desde Secret
        shell: bash
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" ]; then
            echo "Falta el Secret GOOGLE_SERVICES_JSON_B64"
            exit 1
          fi
          echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 --decode > app/google-services.json

      - name: Compilar APK
        shell: bash
        run: |
          PORTAL="${{ vars.PORTAL_URL }}"
          if [ -z "$PORTAL" ]; then
            gradle assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon -PPORTAL_URL="$PORTAL"
          fi

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Heladeria-Los-Nietos-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
