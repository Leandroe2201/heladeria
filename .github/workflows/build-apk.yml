name: Build Android APK - POS + Club

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Crear Firebase POS desde Secret existente
        shell: bash
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" ]; then
            echo "Falta el Secret GOOGLE_SERVICES_JSON_B64 (POS)"
            exit 1
          fi
          mkdir -p app/src/pos
          echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 --decode > app/src/pos/google-services.json

      - name: Crear Firebase Club desde Secret
        shell: bash
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_CLUB_B64 }}" ]; then
            echo "Falta el Secret GOOGLE_SERVICES_CLUB_B64 (Club clientes)"
            exit 1
          fi
          mkdir -p app/src/club
          echo "${{ secrets.GOOGLE_SERVICES_CLUB_B64 }}" | base64 --decode > app/src/club/google-services.json

      - name: Compilar APK POS y Club
        shell: bash
        run: |
          POS_URL="${{ vars.POS_PORTAL_URL }}"
          CLUB_URL="${{ vars.CLUB_PORTAL_URL }}"
          [ -z "$POS_URL" ] && POS_URL="http://200.234.232.76/login"
          [ -z "$CLUB_URL" ] && CLUB_URL="http://200.234.232.76/club"
          gradle assemblePosDebug assembleClubDebug --no-daemon             -PPOS_PORTAL_URL="$POS_URL"             -PCLUB_PORTAL_URL="$CLUB_URL"

      - name: Publicar APK POS
        uses: actions/upload-artifact@v4
        with:
          name: Heladeria-Los-Nietos-POS-APK
          path: app/build/outputs/apk/pos/debug/app-pos-debug.apk
          if-no-files-found: error

      - name: Publicar APK Club
        uses: actions/upload-artifact@v4
        with:
          name: Los-Nietos-Club-APK
          path: app/build/outputs/apk/club/debug/app-club-debug.apk
          if-no-files-found: error
