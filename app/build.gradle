plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def posPortalUrl = project.findProperty('POS_PORTAL_URL') ?: 'http://200.234.232.76/login'
def clubPortalUrl = project.findProperty('CLUB_PORTAL_URL') ?: 'http://200.234.232.76/club'

def esc = { s -> s.replace('\\', '\\\\').replace('"', '\"') }

android {
    namespace 'ar.com.heladerialosnietos.app'
    compileSdk 36

    defaultConfig {
        applicationId 'ar.com.heladerialosnietos.app'
        minSdk 23
        targetSdk 36
        versionCode 4
        versionName '1.3.0'
    }

    flavorDimensions 'portal'
    productFlavors {
        pos {
            dimension 'portal'
            applicationId 'ar.com.heladerialosnietos.app'
            manifestPlaceholders = [appLabel: 'Heladería Los Nietos POS']
            buildConfigField 'String', 'PORTAL_URL', '"' + esc(posPortalUrl) + '"'
            buildConfigField 'boolean', 'ENABLE_CLUB_PUSH', 'false'
        }
        club {
            dimension 'portal'
            applicationId 'ar.com.heladerialosnietos.club'
            manifestPlaceholders = [appLabel: 'Los Nietos Club']
            buildConfigField 'String', 'PORTAL_URL', '"' + esc(clubPortalUrl) + '"'
            buildConfigField 'boolean', 'ENABLE_CLUB_PUSH', 'true'
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
}
