plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def portalUrl = project.findProperty('PORTAL_URL') ?: 'https://ckhgs28k-5050.brs.devtunnels.ms/club'

def escapedPortalUrl = portalUrl.replace('\\', '\\\\').replace('"', '\\"')

android {
    namespace 'ar.com.heladerialosnietos.app'
    compileSdk 36

    defaultConfig {
        applicationId 'ar.com.heladerialosnietos.app'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'PORTAL_URL', '"' + escapedPortalUrl + '"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
}
